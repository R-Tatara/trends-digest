search_settings:
  # 検索ターゲットの設定
  query_template: "created:>{date} sort:stars"
  # 取得するリポジトリの上限数
  limit: 10

gemini_settings:
  model: "gemini-2.0-flash"
  prompt_template: |
    あなたは熟練したソフトウェアエンジニアです。
    以下のGitHubリポジトリの情報を基に、他のエンジニアに向けた解説を作成してください。

    リポジトリ名: {name}
    URL: {url}
    説明: {description}
    Topics: {topics}

    README抜粋:
    {readme_content}

    以下のフォーマットで出力してください。

    一行要約: (100文字以内で、何をするツールか簡潔に)
    解決する課題: (どのような課題を解決するために作られたか)
    主な特徴: (主要な技術の説明を数項目で簡潔に)
    ユースケース: (どのようなプロジェクトやビジネスに適しているか)

email_settings:
  subject_template: "[Weekly Digest] {date} - Popular GitHub Repositories"
  intro_text: "今週注目を集めているGitHubのリポジトリをご紹介します。"
