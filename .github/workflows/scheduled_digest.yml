name: Scheduled Trends Digest

on:
  schedule:
    # 毎週月曜日の朝9時 (JST) = 日曜日の午前0時 (UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 手動実行を可能にする

jobs:
  run-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run digest script
        env:
          # GitHubトークンはActionsで自動生成されるものを使用可能（レート制限緩和のため） of secrets.GITHUB_TOKEN
          # もしくは、個人のPATを使う場合は secrets.MY_GITHUB_TOKEN などに設定してここで指定する
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: uv run main.py
